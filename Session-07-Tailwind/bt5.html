<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanderlust - Lưới Danh Mục Tour</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="max-w-6xl mx-auto px-6 py-10">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
        Các Tour Nổi Bật
      </h1>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div
          class="bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden"
        >
          <img
            src="https://picsum.photos/seed/thailand/400/260"
            alt="Thái Lan"
            class="w-full h-48 object-cover brightness-110"
          />
          <div class="p-4">
            <h2 class="text-lg font-bold text-gray-800">Thái Lan</h2>
            <p class="text-gray-500 text-sm">Xứ sở chùa vàng</p>
          </div>
        </div>
        <div
          class="bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden"
        >
          <img
            src="https://picsum.photos/seed/japan/400/260"
            alt="Nhật Bản"
            class="w-full h-48 object-cover brightness-110"
          />
          <div class="p-4">
            <h2 class="text-lg font-bold text-gray-800">Nhật Bản</h2>
            <p class="text-gray-500 text-sm">Hoa anh đào rực rỡ</p>
          </div>
        </div>
        <div
          class="bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden"
        >
          <img
            src="https://picsum.photos/seed/france/400/260"
            alt="Pháp"
            class="w-full h-48 object-cover brightness-110"
          />
          <div class="p-4">
            <h2 class="text-lg font-bold text-gray-800">Pháp</h2>
            <p class="text-gray-500 text-sm">Kinh đô ánh sáng</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
