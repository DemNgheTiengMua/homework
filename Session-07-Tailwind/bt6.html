<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanderlust - Form Tìm Kiếm Chuyến Đi</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center px-4 py-10">
      <form
        class="w-full max-w-4xl bg-white rounded-xl shadow-lg p-6 flex flex-col md:flex-row md:items-end gap-4"
      >
        <div class="w-full">
          <label for="destination" class="block text-sm font-medium text-gray-700 mb-1">
            Điểm đến
          </label>
          <input
            type="text"
            id="destination"
            placeholder="Bạn muốn đi đâu?"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <div class="w-full">
          <label for="departure" class="block text-sm font-medium text-gray-700 mb-1">
            Ngày đi
          </label>
          <input
            type="date"
            id="departure"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <button
          type="submit"
          class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg px-6 py-2 transition-colors duration-300"
        >
          Tìm kiếm
        </button>
      </form>
    </div>
  </body>
</html>
