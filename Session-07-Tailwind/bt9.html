<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanderlust - Lưới Dịch Vụ Đi Kèm</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <section class="max-w-6xl mx-auto px-6 py-10">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
        Dịch Vụ Đi Kèm
      </h1>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="bg-white rounded-xl shadow p-5">
          <div
            class="w-10 h-10 flex items-center justify-center bg-indigo-100 text-indigo-600 rounded-lg mb-4"
          >
            🏨
          </div>
          <h2 class="font-bold text-gray-800 mb-2">Khách Sạn</h2>
          <p class="text-gray-500 text-sm">
            Hệ thống khách sạn chuẩn quốc tế cao cấp và tiện nghi.
          </p>
        </div>
        <div class="bg-white rounded-xl shadow p-5">
          <div
            class="w-10 h-10 flex items-center justify-center bg-indigo-100 text-indigo-600 rounded-lg mb-4"
          >
            ✈️
          </div>
          <h2 class="font-bold text-gray-800 mb-2">Vé Máy Bay</h2>
          <p class="text-gray-500 text-sm">
            Đối tác từ các hãng hàng không hàng đầu thế giới.
          </p>
        </div>
        <div class="bg-white rounded-xl shadow p-5">
          <div
            class="w-10 h-10 flex items-center justify-center bg-indigo-100 text-indigo-600 rounded-lg mb-4"
          >
            🛡️
          </div>
          <h2 class="font-bold text-gray-800 mb-2">Bảo Hiểm</h2>
          <p class="text-gray-500 text-sm">
            Đảm bảo an toàn 100% trong mọi tình huống khẩn cấp.
          </p>
        </div>
        <div class="bg-white rounded-xl shadow p-5">
          <div
            class="w-10 h-10 flex items-center justify-center bg-indigo-100 text-indigo-600 rounded-lg mb-4"
          >
            🧭
          </div>
          <h2 class="font-bold text-gray-800 mb-2">Hướng Dẫn</h2>
          <p class="text-gray-500 text-sm">
            Đội ngũ hướng dẫn viên người bản địa giàu kinh nghiệm.
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
