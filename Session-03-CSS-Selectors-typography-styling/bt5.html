<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adidas</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        margin-top: 5rem;
      }

      .product-card {
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        line-height: 1.8;
      }

      .product-card > img {
        width: 100%;
        height: auto;
      }

      .product-card > h2 {
        font-size: 1.2rem;
        color: #333;
        text-transform: capitalize;
      }

      .product-card > h3 {
        font-size: 1.1rem;
        color: #e60000;
        padding-bottom: 8px;
      }

      .product-card > button {
        color: rgb(255, 255, 255);
        background-color: rgb(0, 0, 0);
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
      }

      .product-card > button:hover {
        background-color: rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <section class="product-card">
      <img
        src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiklP9sI6Nfdc0WaC1QbAri_lM0bQMipN6f3gH9oeIS-0k90UaXoj7ksO8OSRjj7rT0uRzVFhl20BNMDJ7kNUbES6EIyBryGy3Cdwp2M3iJM65bcPues3BgCnJaYPHZI7NndWhAOFw39ZgMe3u8UydgeOxojOvA-EHhLKrJRQ-S3LIbVT0KZ0-Yg_s-tmDk/s320/giay-the-thao-ben.jpg"
        alt="hình ảnh giày thể thao siêu nhẹ"
      />
      <h2>giày thể thao siêu nhẹ</h2>
      <h3>1.250.000 VNĐ</h3>
      <button>Mua Ngay</button>
    </section>
  </body>
</html>
