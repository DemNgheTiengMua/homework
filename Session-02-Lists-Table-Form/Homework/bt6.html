<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ thông tin cá nhân</title>
    <style>
      fieldset {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <h2>Hồ sơ thông tin cá nhân</h2>
    <form>
      <fieldset>
        <legend>Thông tin cá nhân</legend>
        <div style="margin-bottom: 15px">
          <label for="name">Tên:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Nhập họ và tên..."
          />
        </div>
        <div>
          <label for="birthday">Ngày sinh:</label>
          <input type="date" id="birthday" name="birthday" />
        </div>
      </fieldset>
      <fieldset>
        <legend>Thông tin liên hệ</legend>
        <div style="margin-bottom: 15px">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
          />
        </div>
        <div>
          <label for="phone">Số điện thoại:</label>
          <input type="tel" id="phone" name="phone" placeholder="0912345678" />
        </div>
      </fieldset>
      <label for="notes">Ghi chú bổ sung:</label> <br />
      <textarea
        id="notes"
        name="notes"
        placeholder="Nhập ghi chú của bạn tại đây..."
        style="margin-top: 20px"
      ></textarea>
      <br />
      <button type="submit" style="margin-top: 20px">Lưu hồ sơ</button>
    </form>
  </body>
</html>
