<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh mục</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: block;
        text-align: center;
      }
      .category {
        list-style: none;
        display: block;
      }

      .category > .items {
        display: inline-block;
        text-align: center;
        margin-right: 24px;
        height: 50px;
        line-height: 46px;
        width: 200px;
        border: 2px solid rgb(0, 132, 255);
        border-radius: 8px;
        text-transform: capitalize;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <h2>Danh mục Sản phẩm Nổi bật</h2>
    <ul class="category">
      <li class="items">laptop</li>
      <li class="items">điện thoại</li>
      <li class="items">phụ kiện điện tử</li>
      <li class="items">máy tính bảng (tablet)</li>
      <li class="items">đồng hồ thông minh</li>
    </ul>
  </body>
</html>
