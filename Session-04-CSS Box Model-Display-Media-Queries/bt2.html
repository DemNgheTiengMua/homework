<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      .product-card {
        border: 2px solid blue;
        border-radius: 8px;
        height: fit-content;
        width: 280px;
        padding: 1rem;
        margin: 1rem auto;
      }

      .product-name {
        font-size: 1.25rem;
        text-transform: capitalize;
      }

      .product-desc {
        font-size: 1rem;
        color: #333;
        line-height: 1.5;
      }

      .price {
        font-size: 1.1rem;
        color: #ff1900;
      }
    </style>
  </head>
  <body>
    <section class="product-card">
      <h2 class="product-name">điện thoại thông minh x</h2>
      <p class="product-desc">
        Màn hình 6.5 inch, camera sắc nét, pin dung lượng cao phù hợp cho cả
        ngày dài.
      </p>
      <h3 class="price">Giá: 15.000.000 VNĐ</h3>
    </section>
  </body>
</html>
