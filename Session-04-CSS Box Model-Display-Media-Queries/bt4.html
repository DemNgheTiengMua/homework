<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Now you see me</title>
    <style>
      .line,
      .line-2 {
        display: flex;
      }

      .item {
        display: flex;
        height: 100px;
        width: 100px;
        align-items: center;
        justify-content: center;
      }

      .line > .item:nth-child(2) {
        background-color: red;
        display: none;
      }

      .line-2 > .item:nth-child(2) {
        background-color: blue;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="line">
      <div class="item">Sản phẩm 1</div>
      <div class="item">Sản phẩm 2</div>
      <div class="item">Sản phẩm 3</div>
    </div>

    <div class="line-2">
      <div class="item">Sản phẩm 4</div>
      <div class="item">Sản phẩm 5</div>
      <div class="item">Sản phẩm 6</div>
    </div>
  </body>
</html>
