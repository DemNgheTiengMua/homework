<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm Sách Mới - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="text-center mb-4">Thêm Sách Mới</h2>
              <form>
                <div class="mb-3">
                  <label for="bookName" class="form-label">Tên sách</label>
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="bookName"
                    placeholder="Nhập tên sách..."
                  />
                </div>
                <div class="mb-3">
                  <label for="author" class="form-label">Tác giả</label>
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="author"
                    placeholder="Nhập tên tác giả..."
                  />
                </div>
                <div class="mb-3">
                  <label for="genre" class="form-label">Thể loại</label>
                  <select class="form-select form-select-lg" id="genre">
                    <option selected>Chọn thể loại...</option>
                    <option value="novel">Tiểu thuyết</option>
                    <option value="skill">Kỹ năng</option>
                    <option value="economy">Kinh tế</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Thêm sách
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
