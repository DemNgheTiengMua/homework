<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Talk - Brand Override</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Brand identity: dark red (crimson) + black */
      :root {
        --bs-primary: #8b1e3f;
        --bs-primary-rgb: 139, 30, 63;
      }

      .btn-primary {
        --bs-btn-bg: #8b1e3f;
        --bs-btn-border-color: #8b1e3f;
        --bs-btn-hover-bg: #6f1832;
        --bs-btn-hover-border-color: #6f1832;
        --bs-btn-active-bg: #6f1832;
        --bs-btn-active-border-color: #6f1832;
        --bs-btn-focus-shadow-rgb: 139, 30, 63;
      }

      .event-img {
        object-fit: cover;
        height: 100%;
        min-height: 320px;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm overflow-hidden">
        <div class="row g-0">
          <div class="col-12 col-md-5">
            <img
              src="https://picsum.photos/seed/techtalk/600/700"
              class="event-img w-100"
              alt="Tech Talk"
            />
          </div>
          <div class="col-12 col-md-7">
            <div class="card-body p-4 d-flex flex-column h-100">
              <span class="badge bg-dark mb-2 align-self-start">
                Rikkei Academy Event
              </span>
              <h2 class="fw-bold mb-3">Tech Talk: Tương Lai Lập Trình AI</h2>
              <p class="text-muted">
                Sự kiện chia sẻ về xu hướng lập trình với Trí tuệ nhân tạo, cơ hội
                nghề nghiệp và kỹ năng cần trang bị cho lập trình viên thế hệ mới.
              </p>
              <ul class="list-unstyled mb-4">
                <li class="mb-1">
                  <strong>Thời gian:</strong> 09:00 - 12:00, 25/11/2026
                </li>
                <li class="mb-1">
                  <strong>Địa điểm:</strong> Cơ sở Rikkei Academy HN
                </li>
              </ul>
              <div class="d-flex gap-2 flex-wrap mt-auto">
                <button type="button" class="btn btn-primary">Đăng Ký Ngay</button>
                <button type="button" class="btn btn-dark">Xem Chi Tiết</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
