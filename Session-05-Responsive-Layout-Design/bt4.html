<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 0;
      }
      h2 {
        text-transform: capitalize;
        color: #5a5656;
      }
      .buttons {
        display: flex;
        justify-content: center;
        list-style-type: none;
        padding: 20px;
        width: 100vw;
      }
      .button-items {
        background-color: #4caf50;
        color: white;
        padding: 25px 0px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        flex-basis: 0;
        flex-grow: 1;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>dịch vụ của chúng tôi</h2>
    <ul class="buttons">
      <li class="button-items">Web Design</li>
      <li class="button-items">SEO</li>
      <li class="button-items">Content</li>
    </ul>
  </body>
</html>
