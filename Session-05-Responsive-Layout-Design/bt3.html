<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực Đơn</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100vw;
      }

      body > h2 {
        text-align: center;
        margin: 20px 0;
      }

      .menu {
        display: flex;
        flex-wrap: wrap;
        list-style: none;
        justify-content: space-between;
        gap: 30px;
      }

      .menu-item {
        height: auto;
        width: 220px;
        display: flex;
        flex-direction: column;
        text-align: center;
        align-items: center;
        border-radius: 8px;
        box-shadow: 0px 5px 8px #cccccc;
      }

      .menu-item > img {
        object-fit: cover;
        width: 100%;
        height: 150px;
        border-radius: 8px;
      }
      .menu-item > p {
        margin-top: 0;
        margin-bottom: 20px;
        font-weight: bold;
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Thực Đơn Của Chúng Tôi</h2>
    <ul class="menu">
      <li class="menu-item">
        <img
          src="https://cdn.hstatic.net/files/200000700229/article/cach-lam-salad-trai-cay_6f37f010a1764c0fbacd3157a3bf63c4.jpg"
          alt="Salad Rau Củ Tươi"
        />
        <h3>Salad Rau Củ Tươi</h3>
        <p>45.000 VNĐ</p>
      </li>
      <li class="menu-item">
        <img
          src="https://monngonmoingay.com/wp-content/uploads/2024/01/com-gao-lut.jpg"
          alt="Cơm Gạo Lứt Bổ Dưỡng"
        />
        <h3>Cơm Gạo Lứt Bổ Dưỡng</h3>
        <p>75.000 VNĐ</p>
      </li>
      <li class="menu-item">
        <img
          src="https://cdn.tgdd.vn/2020/09/CookProduct/1200bzhspm-1200x676.jpg"
          alt="Pizza Hải Sản Phô Mai"
        />
        <h3>Pizza Hải Sản Phô Mai</h3>
        <p>120.000 VNĐ</p>
      </li>
      <li class="menu-item">
        <img
          src="https://bioplanet.vn/wp-content/uploads/2022/06/banh-hamburger-bo.jpg"
          alt="Hamburger Bò Úc"
        />
        <h3>Hamburger Bò Úc</h3>
        <p>85.000 VNĐ</p>
      </li>
      <li class="menu-item">
        <img
          src="https://cdn.tgdd.vn/Files/2022/04/07/1424410/bo-tui-cach-lam-suon-heo-nuong-bbq-chuan-vi-cho-cuoi-tuan-202211221345442766.jpg"
          alt="Sườn Nướng BBQ"
        />
        <h3>Sườn Nướng BBQ</h3>
        <p>150.000 VNĐ</p>
      </li>
    </ul>
  </body>
</html>
